<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f2f3f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELITE">
<meta name="description" content="Input & activity tracker for coached sales and real estate consultants.">
<title>ELITE Tracker</title>
<script>
(function () {
  try {
    var raw = localStorage.getItem('elite_tracker_v1');
    var s = raw ? JSON.parse(raw) : null;
    var theme = (s && s.settings && s.settings.theme) || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=61">
</head>
<body>
  <div id="app">
    <!-- Onboarding renders here when not yet set up -->
    <div id="onboarding"></div>

    <!-- Main app -->
    <div id="main" style="display:none">
      <div id="topbar"></div>
      <div id="views"></div>
      <nav id="bottomnav" class="bottomnav"></nav>
    </div>
  </div>

  <!-- Bottom sheet / modal host -->
  <div id="sheet-backdrop" class="sheet-backdrop">
    <div id="sheet" class="sheet"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/icons.js?v=61"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js?v=61"></script>
  <script src="js/auth.js?v=61"></script>
  <script src="js/store.js?v=61"></script>
  <script src="js/push.js?v=61"></script>
  <script src="js/sync.js?v=61"></script>
  <script src="js/data.js?v=61"></script>
  <script src="js/intelligence.js?v=61"></script>
  <script src="js/ui.js?v=61"></script>
  <script src="js/app.js?v=61"></script>
</body>
</html>
